<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio Escolar - Controle de Turmas</title>
    <style>
        /* Definição de Cores e Reset */
        :root {
            --azul-marinho: #002366;
            --azul-royal: #4169E1;
            --branco: #FFFFFF;
            --gelo: #F0F4F8;
            --transicao: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--gelo);
            color: var(--azul-marinho);
            min-height: 100vh;
        }

        /* Menu Superior */
        header {
            background-color: var(--azul-marinho);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            border-bottom: 4px solid var(--azul-royal);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        h1 {
            color: var(--branco);
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-turma {
            background-color: transparent;
            color: var(--branco);
            border: 2px solid var(--azul-royal);
            padding: 10px 25px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            transition: var(--transicao);
        }

        .btn-turma:hover, .btn-turma.active {
            background-color: var(--azul-royal);
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        /* Área de Conteúdo */
        main {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .turma-section {
            display: none; /* Escondido por padrão */
            animation: fadeIn 0.6s ease;
        }

        .turma-section.active {
            display: block;
        }

        .header-turma {
            border-left: 10px solid var(--azul-marinho);
            padding-left: 15px;
            margin-bottom: 30px;
            background: var(--branco);
            padding: 20px;
            border-radius: 0 10px 10px 0;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.05);
        }

        /* Grid de Alunos */
        .grid-alunos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .card-aluno {
            background: var(--branco);
            padding: 15px;
            border-radius: 8px;
            border-bottom: 3px solid var(--azul-royal);
            display: flex;
            align-items: center;
            gap: 15px;
            transition: var(--transicao);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .card-aluno:hover {
            transform: scale(1.03);
            background-color: var(--azul-marinho);
            color: var(--branco);
        }

        .num-chamada {
            background: var(--azul-royal);
            color: white;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 0.8rem;
            font-weight: bold;
        }

        /* Efeito de Fade */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        footer {
            text-align: center;
            padding: 40px;
            color: var(--azul-marinho);
            opacity: 0.7;
        }
    </style>
</head>

        <div class="nav-container">
            <h1>Controle de Portfólio</h1>
            <nav>

                <button class="btn-turma" onclick="mostrarTurma('1B', this)">1° B</button>
                <button class="btn-turma" onclick="mostrarTurma('2A', this)">2° A</button>

            </nav>
        </div>
    </header>

    </main>

        // Função para carregar os alunos nos grids
        function carregarAlunos() {
            for (let turma in dadosAlunos) {
                const container = document.getElementById(`lista-${turma}`);
                dadosAlunos[turma].forEach((nome, index) => {
                    const card = document.createElement('div');
                    card.className = 'card-aluno';
                    card.innerHTML = `
                        <div class="num-chamada">${index + 1}</div>
                        <div class="nome-aluno">${nome}</div>
                    `;
                    container.appendChild(card);
                });
            }
        }

        // Função para trocar de turma no menu
        function mostrarTurma(idTurma, btn) {
            // Esconde todas as seções
            document.querySelectorAll('.turma-section').forEach(sec => {
                sec.classList.remove('active');
            });

            // Remove classe active de todos os botões
            document.querySelectorAll('.btn-turma').forEach(b => {
                b.classList.remove('active');
            });

            // Mostra a seção desejada e ativa o botão
            document.getElementById(idTurma).classList.add('active');
            btn.classList.add('active');

            // Efeito de scroll suave para o topo
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Inicializar a página
        window.onload = carregarAlunos;
    </script>
</body>
